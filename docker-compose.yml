services:
  server-http1:
    build:
      context: ./servers/http1
    container_name: server_http11
    cap_add:
      - NET_ADMIN
    ports:
      - "8080:80"
    volumes:
      - ./servers/http1/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./servers/content:/usr/share/nginx/html:ro
    networks:
      net_bench:
        ipv4_address: 172.20.0.10

  server-http2:
    build:
      context: ./servers/http2
    container_name: server_http2_tls
    cap_add:
      - NET_ADMIN
    ports:
      - "8443:443"
    volumes:
      - ./servers/http2/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./servers/content:/usr/share/nginx/html:ro
      - ./servers/certs:/etc/nginx/certs:ro
    networks:
      net_bench:
        ipv4_address: 172.20.0.20

  server-http3:
    build:
      context: ./servers/http3
    container_name: server_http3_quic
    cap_add:
      - NET_ADMIN
    ports:
      - "9443:443/tcp"
      - "9443:443/udp"
    volumes:
      - ./servers/http3/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./servers/content:/srv:ro
      - ./servers/certs:/etc/caddy/certs:ro
    networks:
      net_bench:
        ipv4_address: 172.20.0.30

  network-client:
    build:
      context: ./client
      dockerfile: network/Dockerfile
    container_name: network_client
    cap_add:
      - NET_ADMIN
    command: ["sleep", "infinity"]
    working_dir: /app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./client:/app/client:ro
      - ./results/raw:/app/results/raw
      - ./scripts:/app/scripts:ro
      - ./servers/content:/app/content
      - ./servers/certs/localhost.crt:/app/certs/localhost.crt:ro
    networks:
      net_bench:
        ipv4_address: 172.20.0.40

networks:
  net_bench:
    name: net_bench
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
